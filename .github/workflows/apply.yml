name: terraform-apply

# Manual click-to-run apply for the prod ledger estate (CONSPLIT2). workflow_dispatch
# gates the run before it starts.
#
# Run via:
#   - Actions tab → terraform-apply → "Run workflow"
#   - gh workflow run apply.yml -R csyn-portfolio/csyn-consensus-prod \
#       -f configs="ledger-workloads/validator-prod"
#
# Default is EMPTY — a plain run does nothing, so the prod estate is never
# touched by accident. Dispatch roots explicitly.
# All roots apply as the folder-scoped ledger-apply SA.
# This is the dedicated repo for prod/mainnet regulated roots (CONSPLIT2).

on:
  workflow_dispatch:
    inputs:
      configs:
        description: 'Comma-separated ledger roots to apply (e.g. ledger-workloads/host-dev)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write   # WIF

# Serialize applies: roots share state via remote_state (later roots read
# earlier roots' fresh state), so two concurrent apply runs could race the
# csyn-tf-state backend. Queue a second run behind the first; never cancel a
# half-finished apply.
concurrency:
  group: tf-apply-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      configs: ${{ steps.parse.outputs.configs }}
    steps:
      - id: parse
        run: |
          configs=$(echo '${{ inputs.configs }}' | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))' -c)
          echo "configs=$configs" >> "$GITHUB_OUTPUT"
          echo "Will apply: $configs"

  apply:
    needs: prepare
    if: needs.prepare.outputs.configs != '[]'
    runs-on: ubuntu-latest
    environment: production   # deployment history + branch_policy=protected_branches enforced
    env:
      # Route provider installs through the CS-owned mirror (TOFU1). Must be
      # TF_CLI_CONFIG_FILE — TOFU_CLI_CONFIG_FILE is silently ignored by tofu.
      TF_CLI_CONFIG_FILE: ${{ github.workspace }}/.ci/tofu-mirror.tofurc
    strategy:
      fail-fast: true         # one failure stops downstream applies
      max-parallel: 1         # serialize; host-dev is a prerequisite for service roots
      matrix:
        config: ${{ fromJSON(needs.prepare.outputs.configs) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          # Constant ledger identity. The APPLY provider is main-pinned (apply
          # only from main); ledger-apply is projectCreator on ledger/{dev,prod}
          # ONLY (spec §3.8). The repo principalSet holds workloadIdentityUser on
          # ledger-apply. SA email is an identifier, not a secret.
          workload_identity_provider: ${{ secrets.WIF_PROVIDER_APPLY }}
          service_account: ledger-apply@csyn-platform.iam.gserviceaccount.com

      - name: Mint git token for the module repos (sibling + substrate)
        # CONSPLIT2: ledger-workloads roots git-source modules/ledger-{service,node}
        # from the (private) sibling practice repo (csyn-consensus-infra) by pinned
        # tag; ledger-service then git-sources modules/service-project from the
        # (private) substrate repo (cloud-syndicate-platform@v0.1.0). One short-lived
        # GitHub App installation token (Contents:Read, those two repos only)
        # authorizes both `tofu init` fetches — NOT a long-lived PAT.
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MODULE_READER_CLIENT_ID }}
          private-key: ${{ secrets.MODULE_READER_APP_PRIVATE_KEY }}
          owner: csyn-portfolio
          repositories: |
            cloud-syndicate-platform
            csyn-consensus-infra

      - name: Configure git to use the app token for the module fetch
        run: |
          for repo in cloud-syndicate-platform csyn-consensus-infra; do
            git config --global \
              url."https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/csyn-portfolio/$repo".insteadOf \
              "https://github.com/csyn-portfolio/$repo"
          done

      - uses: opentofu/setup-opentofu@847eaa4afeb791b06daa46e8eafa8b1b68d7cfb4 # v2.0.1
        with:
          tofu_version: 1.12.0
          tofu_wrapper: false

      - name: tofu init (mirror-enforced)
        working-directory: ${{ matrix.config }}
        run: |
          set -o pipefail
          tofu init -input=false 2>&1 | tee /tmp/tofu-init.log
          # Supply-chain guardrail: providers MUST install from the CS mirror
          # ("verified checksum"), never the public registry ("signed, key ID").
          if grep -q 'signed, key ID' /tmp/tofu-init.log; then
            echo "::error::Provider installed from the public registry, not the CS mirror. The provider_installation mirror config is not in effect — check TF_CLI_CONFIG_FILE (must be TF_, not TOFU_)."
            exit 1
          fi

      - name: tofu apply
        working-directory: ${{ matrix.config }}
        run: tofu apply -input=false -auto-approve
